<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Dashboard — EduFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080C14;
      --surface: #0D1321;
      --surface2: #111827;
      --border: rgba(255,255,255,0.07);
      --text: #F1F5F9;
      --muted: #64748B;
      --accent: #38BDF8;
      --green: #34D399;
      --font: 'DM Sans', sans-serif;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

    nav { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(8,12,20,.85); backdrop-filter: blur(18px); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-weight: 700; font-size: 1.3rem; color: var(--accent); text-decoration: none; }
    .logo span { color: #fff; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-link { color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 500; transition: color .2s; }
    .nav-link:hover, .nav-link.active { color: var(--text); }
    .nav-user { font-size: .85rem; color: var(--muted); }
    .nav-user strong { color: var(--text); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: .45rem 1.1rem; border-radius: 10px; font-size: .82rem; cursor: pointer; font-family: var(--font); transition: all .2s; }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .page { padding-top: 88px; padding-bottom: 5rem; max-width: 1000px; margin: 0 auto; padding-left: 1.5rem; padding-right: 1.5rem; }

    .welcome { margin-bottom: 2rem; }
    .welcome h1 { font-size: 1.8rem; font-weight: 700; }
    .welcome h1 span { color: var(--accent); }
    .welcome p { color: var(--muted); margin-top: .5rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    @media (max-width: 640px) { .stats-grid { grid-template-columns: 1fr; } }

    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .stat-value { font-size: 2rem; font-weight: 700; color: var(--accent); }

    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 2rem; }
    .section-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .section-title { font-size: 1rem; font-weight: 600; }

    .course-item { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; }
    .course-item:last-child { border-bottom: none; }
    .course-item:hover { background: rgba(255,255,255,.02); }
    .course-title { font-weight: 600; font-size: 1rem; margin-bottom: .25rem; }
    .course-meta { font-size: .8rem; color: var(--muted); }
    .progress-bar { width: 200px; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: .5rem; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 3px; }
    .progress-text { font-size: 11px; color: var(--muted); margin-top: 4px; text-align: right; }

    .empty-state { text-align: center; padding: 3rem; color: var(--muted); }
    .empty-icon { font-size: 2.5rem; margin-bottom: .75rem; opacity: .5; }

    .loading { text-align: center; padding: 3rem; color: var(--muted); }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast { position: fixed; bottom: 24px; right: 24px; z-index: 300; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; font-size: 13px; color: var(--text); transform: translateY(100px); opacity: 0; transition: all .35s; max-width: 320px; }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.toast-error { border-color: rgba(248,113,113,.4); }

    @media (max-width: 640px) {
      .course-item { grid-template-columns: 1fr; }
      .progress-bar { width: 100%; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="logo">Edu<span>Flow</span></a>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/courses.html" class="nav-link">Courses</a>
      <a href="/dashboard.html" class="nav-link active">Dashboard</a>
      <a href="/student-profile.html" class="nav-link">Profile</a>
      <span class="nav-user">Hi, <strong id="nav-username">—</strong></span>
      <button class="btn-ghost" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="page">
    <div class="welcome">
      <h1>Welcome back, <span id="welcome-name">Student</span> 👋</h1>
      <p>Here's your learning progress at a glance.</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Enrolled Courses</div>
        <div class="stat-value" id="stat-courses">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Lessons Completed</div>
        <div class="stat-value" id="stat-lessons">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Overall Progress</div>
        <div class="stat-value" id="stat-progress">—</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title">📚 My Enrolled Courses</div>
      </div>
      <div id="courses-list">
        <div class="loading"><div class="spinner"></div>Loading your courses…</div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    // Auth guard
    if (!token || !user) {
      window.location.href = '/login.html';
    } else if (user.role !== 'student') {
      window.location.href = '/instructor-dashboard.html';
    }

    document.getElementById('nav-username').textContent = user?.username || 'Student';
    document.getElementById('welcome-name').textContent = user?.username || 'Student';

    async function init() {
      await loadDashboard();
    }

    async function loadDashboard() {
      try {
        // Get enrolled courses
        const res = await apiFetch('/api/courses/me/courses');
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        const courses = data.courses || [];
        document.getElementById('stat-courses').textContent = courses.length;

        if (courses.length === 0) {
          document.getElementById('courses-list').innerHTML = 
            '<div class="empty-state"><div class="empty-icon">📚</div>You haven\'t enrolled in any courses yet.<br><a href="/courses.html" style="color:var(--accent);text-decoration:none;">Browse courses →</a></div>';
          document.getElementById('stat-lessons').textContent = '0';
          document.getElementById('stat-progress').textContent = '0%';
          return;
        }

        // Fetch progress for each course
        let totalLessons = 0;
        let completedLessons = 0;

        const coursesWithProgress = await Promise.all(
          courses.map(async (c) => {
            try {
              const progressRes = await apiFetch(`/api/courses/${c._id}/progress`);
              const progressData = await progressRes.json();
              const progress = progressRes.ok && progressData.success ? progressData.progress : null;
              
              if (progress) {
                totalLessons += progress.totalLessons || 0;
                completedLessons += progress.completedLessons || 0;
              }
              
              return { ...c, progress };
            } catch {
              return { ...c, progress: null };
            }
          })
        );

        // Update stats
        document.getElementById('stat-lessons').textContent = completedLessons;
        const overallPct = totalLessons > 0 ? Math.round((completedLessons / totalLessons) * 100) : 0;
        document.getElementById('stat-progress').textContent = overallPct + '%';

        // Render courses
        document.getElementById('courses-list').innerHTML = coursesWithProgress.map(c => {
          const total = c.progress?.totalLessons || 0;
          const completed = c.progress?.completedLessons || 0;
          const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

          return `
            <div class="course-item">
              <div>
                <div class="course-title">${escHtml(c.title)}</div>
                <div class="course-meta">by ${escHtml(c.instructor_id?.username || 'Unknown')}</div>
                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                <div class="progress-text">${completed}/${total} lessons completed (${pct}%)</div>
              </div>
              <a href="/course.html?id=${c._id}" class="btn-ghost" style="text-decoration:none;">Continue →</a>
            </div>
          `;
        }).join('');

      } catch (err) {
        document.getElementById('courses-list').innerHTML = `<div class="empty-state">❌ ${err.message}</div>`;
      }
    }

    function apiFetch(path, method = 'GET', body = null) {
      const opts = {
        method,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
        },
      };
      if (body) opts.body = JSON.stringify(body);
      return fetch(API + path, opts);
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    let toastTimer;
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `show toast-${type}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = ''; }, 3500);
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/';
    }

    init();
  </script>

</body>
</html>
