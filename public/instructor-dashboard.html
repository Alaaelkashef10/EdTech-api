<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instructor Dashboard — EduFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --bg: #030712;
      --surface: #0f172a;
      --surface-hover: #1e293b;
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #38BDF8;
      --accent-hover: #0891b2;
      --accent-glow: rgba(56,189,248,0.15);
      --green: #34d399;
      --red: #F87171;
      --font: 'Sora', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ===== NAV ===== */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(8,12,20,0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-family: var(--font);
      font-weight: 700; font-size: 1.3rem;
      color: var(--accent); text-decoration: none;
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--text); }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-link {
      color: var(--text-muted); text-decoration: none;
      font-size: 0.9rem; font-weight: 500;
      transition: color 0.2s; position: relative;
      font-family: var(--font-body);
    }
    .nav-link:hover, .nav-link.active { color: var(--text); }
    .nav-link.active::after {
      content: ''; position: absolute; bottom: -4px; left: 0; right: 0;
      height: 2px; background: var(--accent); border-radius: 2px;
    }
    .nav-user {
      font-size: 0.85rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 0.5rem;
      font-family: var(--font-body);
    }
    .nav-user strong { color: var(--text); font-weight: 600; }
    .btn-ghost-nav {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.2rem;
      border-radius: 10px;
      font-size: 0.85rem; font-weight: 500;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.2s;
    }
    .btn-ghost-nav:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }

    /* ===== PAGE ===== */
    .page {
      padding-top: 88px;
      padding-bottom: 5rem;
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    /* ===== STATS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s;
    }
    .stat-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }
    .stat-value {
      font-family: var(--font);
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ===== SECTION ===== */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .section-header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title {
      font-family: var(--font);
      font-size: 1.1rem;
      font-weight: 600;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: white;
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56,189,248,0.35);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.2rem;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-danger {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      color: var(--red);
      padding: 0.5rem 1.2rem;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .btn-danger:hover { background: rgba(248,113,113,0.2); }

    /* ===== COURSE LIST ===== */
    .course-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition: background 0.2s;
    }
    .course-row:hover { background: rgba(255,255,255,0.02); }
    .course-row:last-child { border-bottom: none; }
    .course-info h4 {
      font-family: var(--font);
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .course-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .course-actions { display: flex; gap: 0.5rem; }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      padding: 2rem;
    }
    .modal h2 {
      font-family: var(--font);
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .form-field { margin-bottom: 1rem; }
    .form-field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-field input,
    .form-field textarea {
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-field input:focus,
    .form-field textarea:focus { border-color: var(--accent); }
    .form-field textarea { min-height: 100px; resize: vertical; }

    /* ===== EMPTY / LOADING ===== */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-family: var(--font-body);
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(56,189,248,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== TOAST ===== */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 300;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      font-size: 0.9rem;
      color: var(--text);
      display: flex; align-items: center; gap: 0.75rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      transform: translateY(120px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 360px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.toast-success { border-color: rgba(52,211,153,0.3); }
    #toast.toast-error { border-color: rgba(248,113,113,0.3); }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: 1fr; }
      .course-row { flex-direction: column; align-items: flex-start; gap: 1rem; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <!-- Copy this exact nav to all pages -->
<<nav>
  <a href="/" class="logo">Edu<span>Flow</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link" id="nav-home">Home</a>
    <a href="/courses.html" class="nav-link" id="nav-courses">Courses</a>
    
    <!-- Dynamic: href set by JavaScript based on role -->
    <a href="#" class="nav-link" id="nav-dashboard" style="display:none">Dashboard</a>
    <a href="#" class="nav-link" id="nav-profile" style="display:none">Profile</a>
    
    <!-- Auth -->
    <a href="/login.html" class="nav-link" id="nav-login">Login</a>
    <a href="/register.html" class="nav-link" id="nav-register">Register</a>
    
    <!-- User -->
    <span class="nav-user" id="nav-user-info" style="display:none">
      <span id="nav-avatar">U</span>
      <strong id="nav-username">—</strong>
    </span>
    <button class="btn-ghost-nav" onclick="logout()" id="nav-logout" style="display:none">Logout</button>
  </div>
</nav>

  <div class="page">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" style="color: var(--accent);" id="stat-courses">—</div>
        <div class="stat-label">My Courses</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color: var(--green);" id="stat-students">—</div>
        <div class="stat-label">Total Students</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color: #FBBF24;" id="stat-lessons">—</div>
        <div class="stat-label">Total Lessons</div>
      </div>
    </div>

    <!-- My Courses Section -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">📚 My Courses</div>
        <button class="btn-primary" onclick="openCreateModal()">+ New Course</button>
      </div>
      <div id="courses-container">
        <div class="empty-state">
          <div class="spinner"></div>
          <p>Loading your courses...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Create Course</h2>
      <div class="form-field">
        <label>Title</label>
        <input type="text" id="course-title" placeholder="e.g. Advanced JavaScript" />
      </div>
      <div class="form-field">
        <label>Description</label>
        <textarea id="course-desc" placeholder="Course description..."></textarea>
      </div>
      <div class="form-field">
        <label>Thumbnail URL (optional)</label>
        <input type="text" id="course-thumb" placeholder="https://..." />
      </div>
      <div style="display:flex;gap:0.5rem;justify-content:flex-end;margin-top:1.5rem;">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="saveCourse()" id="modal-save-btn">Create</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
	<script src="/js/nav.js"></script>
  <script>
    // ⚠️ PORT 3000
    const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    // Auth guard
    if (!token || !user) {
      window.location.href = '/login.html';
    } else if (user.role !== 'instructor') {
      window.location.href = '/dashboard.html';
    }

    document.getElementById('nav-username').textContent = user?.username || 'Instructor';
    document.getElementById('nav-avatar').textContent = (user?.username || 'I').charAt(0).toUpperCase();

    let editingCourseId = null;

    async function init() {
      await loadStats();
      await loadMyCourses();
    }

    // ========== STATS ==========
    async function loadStats() {
      try {
        const res = await fetch(API + '/api/courses/instructor/my-courses', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        const courses = data.courses || [];
        document.getElementById('stat-courses').textContent = courses.length;

        const totalStudents = courses.reduce((sum, c) => sum + (c.students?.length || 0), 0);
        document.getElementById('stat-students').textContent = totalStudents;

        // Lessons count would require fetching each course's lessons
        document.getElementById('stat-lessons').textContent = '—';
      } catch (err) {
        console.error('Stats error:', err);
      }
    }

    // ========== MY COURSES ==========
    async function loadMyCourses() {
      const container = document.getElementById('courses-container');

      try {
        const res = await fetch(API + '/api/courses/instructor/my-courses', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || `HTTP ${res.status}`);
        }

        const courses = data.courses || [];

        if (courses.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div style="font-size:3rem;margin-bottom:1rem;opacity:.5;">📚</div>
              <p>You haven't created any courses yet.</p>
              <button class="btn-primary" style="margin-top:1rem;" onclick="openCreateModal()">Create Your First Course</button>
            </div>`;
          return;
        }

        container.innerHTML = courses.map(c => `
          <div class="course-row">
            <div class="course-info">
              <h4>${escHtml(c.title)}</h4>
              <p>${c.students?.length || 0} students • ${escHtml(c.description?.substring(0, 60) || '')}${c.description?.length > 60 ? '...' : ''}</p>
            </div>
            <div class="course-actions">
              <button class="btn-secondary" onclick="openEditModal('${c._id}', '${escHtml(c.title)}', '${escHtml(c.description || '')}', '${escHtml(c.thumbnail || '')}')">✏️ Edit</button>
              <button class="btn-danger" onclick="deleteCourse('${c._id}')">🗑️ Delete</button>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error('loadMyCourses ERROR:', err);
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size:2rem;margin-bottom:1rem;">⚠️</div>
            <p>Failed to load courses: ${escHtml(err.message)}</p>
            <button class="btn-primary" style="margin-top:1rem;" onclick="loadMyCourses()">Retry</button>
          </div>`;
      }
    }

    // ========== CREATE / EDIT ==========
    function openCreateModal() {
      editingCourseId = null;
      document.getElementById('modal-title').textContent = 'Create Course';
      document.getElementById('course-title').value = '';
      document.getElementById('course-desc').value = '';
      document.getElementById('course-thumb').value = '';
      document.getElementById('modal-save-btn').textContent = 'Create';
      document.getElementById('modal').classList.add('active');
    }

    function openEditModal(id, title, desc, thumb) {
      editingCourseId = id;
      document.getElementById('modal-title').textContent = 'Edit Course';
      document.getElementById('course-title').value = title;
      document.getElementById('course-desc').value = desc;
      document.getElementById('course-thumb').value = thumb;
      document.getElementById('modal-save-btn').textContent = 'Save Changes';
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    async function saveCourse() {
      const title = document.getElementById('course-title').value.trim();
      const description = document.getElementById('course-desc').value.trim();
      const thumbnail = document.getElementById('course-thumb').value.trim();

      if (!title || !description) {
        showToast('Title and description are required', 'error');
        return;
      }

      try {
        const url = editingCourseId
          ? `${API}/api/courses/${editingCourseId}`
          : `${API}/api/courses`;
        const method = editingCourseId ? 'PUT' : 'POST';

        const res = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ title, description, thumbnail })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        showToast(editingCourseId ? '✅ Course updated' : '✅ Course created', 'success');
        closeModal();
        await loadMyCourses();
        await loadStats();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // ========== DELETE ==========
    async function deleteCourse(courseId) {
      if (!confirm('Are you sure you want to delete this course? This cannot be undone.')) return;

      try {
        const res = await fetch(`${API}/api/courses/${courseId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        showToast('✅ Course deleted', 'success');
        await loadMyCourses();
        await loadStats();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // ========== LOGOUT ==========
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/';
    }

    // ========== UTILS ==========
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    let toastTimer;
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `show toast-${type}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = ''; }, 3500);
    }
	
	

    // Boot
    init();
  </script>
</body>
</html>
