<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instructor Profile — EduFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #030712; --surface: #0f172a; --border: rgba(255,255,255,0.06);
      --text: #f8fafc; --text-muted: #64748b; --accent: #38BDF8;
      --green: #34d399; --red: #F87171;
      --font: 'Sora', sans-serif; --font-body: 'DM Sans', sans-serif;
    }
    body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(8,12,20,0.85); backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-family: var(--font); font-weight: 700; font-size: 1.3rem; color: var(--accent); text-decoration: none; }
    .logo span { color: var(--text); }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; font-family: var(--font-body); }
    .nav-link:hover, .nav-link.active { color: var(--text); }
    .btn-ghost-nav { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0.5rem 1.2rem; border-radius: 10px; font-size: 0.85rem; cursor: pointer; font-family: var(--font-body); transition: all 0.2s; }
    .btn-ghost-nav:hover { border-color: var(--accent); color: var(--accent); }
    .page { padding-top: 88px; padding-bottom: 5rem; max-width: 800px; margin: 0 auto; padding-left: 1.5rem; padding-right: 1.5rem; }
    .profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; color: #fff; flex-shrink: 0; }
    .profile-info h1 { font-size: 1.5rem; font-weight: 700; font-family: var(--font); margin-bottom: 0.25rem; }
    .profile-info p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; background: rgba(56,189,248,0.12); color: var(--accent); }
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 2rem; }
    .section-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; }
    .section-title { font-size: 1rem; font-weight: 600; font-family: var(--font); }
    .edit-field { margin-bottom: 1rem; }
    .edit-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
    .edit-field input { width: 100%; max-width: 300px; background: #1e293b; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px 12px; color: var(--text); font-family: var(--font-body); font-size: 13px; outline: none; }
    .edit-field input:focus { border-color: var(--accent); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #0891b2); color: white; border: none; padding: 0.6rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: var(--font); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(56,189,248,0.35); }
    .btn-danger { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.3); padding: 0.6rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: var(--font); }
    .btn-danger:hover { background: rgba(248,113,113,0.25); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0.6rem 1.5rem; border-radius: 10px; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; font-family: var(--font-body); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }
    #toast { position: fixed; bottom: 24px; right: 24px; z-index: 300; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; font-size: 13px; color: var(--text); transform: translateY(100px); opacity: 0; transition: all 0.35s; max-width: 320px; }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.toast-success { border-color: rgba(52,211,153,0.4); }
    #toast.toast-error { border-color: rgba(248,113,113,0.4); }
  </style>
</head>
<body>

  <!-- Copy this exact nav to all pages -->
<nav>
  <a href="/" class="logo">Edu<span>Flow</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/courses.html" class="nav-link">Courses</a>
    <a href="#" class="nav-link" id="nav-dashboard" style="display:none">Dashboard</a>
    <a href="#" class="nav-link" id="nav-profile" style="display:none">Profile</a>
    <a href="/admin-dashboard.html" class="nav-link" id="nav-admin" style="display:none;color:#F87171">Admin</a>
    <a href="/login.html" class="nav-link" id="nav-login">Login</a>
    <a href="/register.html" class="nav-link" id="nav-register">Register</a>
    <span class="nav-user" id="nav-user-info" style="display:none">
      <span style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#38BDF8,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:#fff;" id="nav-avatar">U</span>
      <strong id="nav-username">—</strong>
    </span>
    <button class="btn-ghost-nav" onclick="logout()" id="nav-logout" style="display:none">Logout</button>
  </div>
</nav>

  <div class="page">
    <div class="profile-card">
      <div class="profile-avatar" id="profile-avatar">I</div>
      <div class="profile-info" id="profile-view">
        <h1 id="profile-name">Loading…</h1>
        <p id="profile-email">—</p>
        <span class="badge">● Instructor</span>
        <div style="margin-top: 1rem; display: flex; gap: .5rem;">
          <button class="btn-secondary" onclick="enterEditMode()">✏️ Edit Profile</button>
          <button class="btn-danger" onclick="confirmDeleteAccount()">🗑️ Delete Account</button>
        </div>
      </div>
      <div class="profile-info" id="profile-edit" style="display:none; flex: 1;">
        <div class="edit-field">
          <label>Username</label>
          <input type="text" id="edit-username" />
        </div>
        <div class="edit-field">
          <label>Email</label>
          <input type="email" id="edit-email" />
        </div>
        <div class="edit-field">
          <label>New Password (leave blank to keep current)</label>
          <input type="password" id="edit-password" placeholder="••••••••" />
        </div>
        <div style="margin-top: 1rem; display: flex; gap: .5rem;">
          <button class="btn-primary" onclick="saveProfile()">💾 Save</button>
          <button class="btn-secondary" onclick="cancelEdit()">❌ Cancel</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title">📊 My Teaching Stats</div>
      </div>
      <div style="padding: 1.5rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;">
        <div style="text-align: center;">
          <div style="font-size: 2rem; font-weight: 700; color: var(--accent); font-family: var(--font);" id="stat-courses">—</div>
          <div style="font-size: .8rem; color: var(--text-muted); margin-top: .25rem;">Courses</div>
        </div>
        <div style="text-align: center;">
          <div style="font-size: 2rem; font-weight: 700; color: var(--green); font-family: var(--font);" id="stat-students">—</div>
          <div style="font-size: .8rem; color: var(--text-muted); margin-top: .25rem;">Total Students</div>
        </div>
        <div style="text-align: center;">
          <div style="font-size: 2rem; font-weight: 700; color: #FBBF24; font-family: var(--font);" id="stat-lessons">—</div>
          <div style="font-size: .8rem; color: var(--text-muted); margin-top: .25rem;">Lessons</div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token || !user) {
      window.location.href = '/login.html';
    } else if (user.role !== 'instructor') {
      window.location.href = '/dashboard.html';
    }

    document.getElementById('nav-username').textContent = user?.username || 'Instructor';

    async function init() {
      await loadProfile();
      await loadStats();
    }

    async function loadProfile() {
      try {
        const res = await fetch(API + '/api/users/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        const u = data.user;
        document.getElementById('profile-name').textContent = u.username || 'Instructor';
        document.getElementById('profile-email').textContent = u.email || '—';
        document.getElementById('profile-avatar').textContent = (u.username || 'I').charAt(0).toUpperCase();
      } catch (err) {
        showToast('Failed to load profile: ' + err.message, 'error');
      }
    }

    async function loadStats() {
      try {
        const res = await fetch(API + '/api/courses/instructor/my-courses', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        const courses = data.courses || [];
        document.getElementById('stat-courses').textContent = courses.length;
        const totalStudents = courses.reduce((sum, c) => sum + (c.students?.length || 0), 0);
        document.getElementById('stat-students').textContent = totalStudents;
        document.getElementById('stat-lessons').textContent = '—';
      } catch (err) {
        showToast('Failed to load stats: ' + err.message, 'error');
      }
    }

    function enterEditMode() {
      const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
      document.getElementById('edit-username').value = currentUser.username || '';
      document.getElementById('edit-email').value = currentUser.email || '';
      document.getElementById('edit-password').value = '';
      document.getElementById('profile-view').style.display = 'none';
      document.getElementById('profile-edit').style.display = 'block';
    }

    function cancelEdit() {
      document.getElementById('profile-view').style.display = 'block';
      document.getElementById('profile-edit').style.display = 'none';
    }

    async function saveProfile() {
      const username = document.getElementById('edit-username').value.trim();
      const email = document.getElementById('edit-email').value.trim();
      const password = document.getElementById('edit-password').value;

      if (!username || !email) {
        showToast('Username and email are required', 'error');
        return;
      }

      try {
        const body = { username, email };
        if (password) body.password = password;

        const res = await fetch(API + '/api/users/me', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        const updatedUser = { ...user, username, email };
        localStorage.setItem('user', JSON.stringify(updatedUser));

        document.getElementById('profile-name').textContent = username;
        document.getElementById('profile-email').textContent = email;
        document.getElementById('profile-avatar').textContent = username.charAt(0).toUpperCase();
        document.getElementById('nav-username').textContent = username;

        cancelEdit();
        showToast('✅ Profile updated', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function confirmDeleteAccount() {
      if (!confirm('⚠️ WARNING: This will permanently delete your account and all your data. This cannot be undone.\n\nAre you sure?')) return;
      if (!confirm('Final confirmation: This action is irreversible. Continue?')) return;
      deleteAccount();
    }

    async function deleteAccount() {
      try {
        const res = await fetch(API + '/api/users/me', {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        logout();
        showToast('Account deleted', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/';
    }

    let toastTimer;
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `show toast-${type}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = ''; }, 3500);
    }
	function updateNav() {
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || 'null');
  
  const loginLink = document.getElementById('nav-login');
  const registerLink = document.getElementById('nav-register');
  const logoutBtn = document.getElementById('nav-logout');
  const userInfo = document.getElementById('nav-user-info');
  const usernameEl = document.getElementById('nav-username');
  const avatarEl = document.getElementById('nav-avatar');
  
  // Dynamic links
  const dashboardLink = document.getElementById('nav-dashboard');
  const profileLink = document.getElementById('nav-profile');
  const adminLink = document.getElementById('nav-admin');
  
  if (token && user) {
    // Hide auth links
    if (loginLink) loginLink.style.display = 'none';
    if (registerLink) registerLink.style.display = 'none';
    if (logoutBtn) logoutBtn.style.display = 'inline-block';
    if (userInfo) userInfo.style.display = 'flex';
    if (usernameEl) usernameEl.textContent = user.username || 'User';
    if (avatarEl) avatarEl.textContent = (user.username || 'U').charAt(0).toUpperCase();
    
    // Set role-specific links
    if (user.role === 'student') {
      if (dashboardLink) {
        dashboardLink.style.display = 'inline-block';
        dashboardLink.href = '/dashboard.html';
      }
      if (profileLink) {
        profileLink.style.display = 'inline-block';
        profileLink.href = '/student-profile.html';
      }
    } else if (user.role === 'instructor') {
      if (dashboardLink) {
        dashboardLink.style.display = 'inline-block';
        dashboardLink.href = '/instructor-dashboard.html';
      }
      if (profileLink) {
        profileLink.style.display = 'inline-block';
        profileLink.href = '/instructor-profile.html';
      }
    } else if (user.role === 'admin') {
      if (adminLink) adminLink.style.display = 'inline-block';
      if (dashboardLink) {
        dashboardLink.style.display = 'inline-block';
        dashboardLink.href = '/admin-dashboard.html';
      }
    }
  } else {
    // Show auth links
    if (loginLink) loginLink.style.display = 'inline-block';
    if (registerLink) registerLink.style.display = 'inline-block';
    if (logoutBtn) logoutBtn.style.display = 'none';
    if (userInfo) userInfo.style.display = 'none';
    
    // Hide all role links
    [dashboardLink, profileLink, adminLink].forEach(el => {
      if (el) {
        el.style.display = 'none';
        el.href = '#';
      }
    });
  }
}
    init();
  </script>
</body>
</html>
