<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile — EduFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080C14;
      --surface: #0D1321;
      --surface2: #111827;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #F1F5F9;
      --muted: #64748B;
      --accent: #38BDF8;
      --green: #34D399;
      --amber: #FBBF24;
      --red: #F87171;
      --purple: #A78BFA;
      --font: 'DM Sans', sans-serif;
    }
    html { font-size: 15px; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }

    /* Nav */
    nav { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(8,12,20,.85); backdrop-filter: blur(18px); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-weight: 700; font-size: 1.3rem; color: var(--accent); text-decoration: none; }
    .logo span { color: #fff; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-link { color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 500; transition: color .2s; }
    .nav-link:hover, .nav-link.active { color: var(--text); }
    .nav-user { font-size: .85rem; color: var(--muted); }
    .nav-user strong { color: var(--text); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: .45rem 1.1rem; border-radius: 10px; font-size: .82rem; cursor: pointer; font-family: var(--font); transition: all .2s; }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
	
    /* Page */
    .page { padding-top: 88px; padding-bottom: 5rem; max-width: 1000px; margin: 0 auto; padding-left: 1.5rem; padding-right: 1.5rem; }

    /* Profile Card */
    .profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 1.5rem; }
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; color: #fff; flex-shrink: 0; }
    .profile-info h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .25rem; }
    .profile-info p { color: var(--muted); font-size: .9rem; margin-bottom: .5rem; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .badge-student { background: rgba(52,211,153,.12); color: var(--green); }

    /* Section */
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 2rem; }
    .section-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .section-title { font-size: 1rem; font-weight: 600; }
    .section-count { font-size: 12px; color: var(--muted); background: var(--surface2); padding: 3px 10px; border-radius: 20px; }

    /* Course List */
    .course-item { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; }
    .course-item:last-child { border-bottom: none; }
    .course-item:hover { background: rgba(255,255,255,.02); }
    .course-title { font-weight: 600; font-size: 1rem; margin-bottom: .25rem; }
    .course-meta { font-size: .8rem; color: var(--muted); }
    .progress-bar { width: 200px; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: .5rem; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 3px; transition: width .3s; }
    .progress-text { font-size: 11px; color: var(--muted); margin-top: 4px; text-align: right; }

    /* Empty */
    .empty-state { text-align: center; padding: 3rem; color: var(--muted); }
    .empty-icon { font-size: 2.5rem; margin-bottom: .75rem; opacity: .5; }

    /* Loading */
    .loading { text-align: center; padding: 3rem; color: var(--muted); }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    #toast { position: fixed; bottom: 24px; right: 24px; z-index: 300; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.4); transform: translateY(100px); opacity: 0; transition: all .35s; max-width: 320px; }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.toast-error { border-color: rgba(248,113,113,.4); }
	.edit-field { margin-bottom: 1rem; }
.edit-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.edit-field input { 
  width: 100%; 
  max-width: 300px; 
  background: var(--bg); 
  border: 1px solid var(--border); 
  border-radius: 8px; 
  padding: 10px 12px; 
  color: var(--text); 
  font-family: var(--font); 
  font-size: 13px; 
  outline: none; 
}
.edit-field input:focus { border-color: var(--accent); }
    @media (max-width: 640px) {
      .profile-card { flex-direction: column; text-align: center; }
      .course-item { grid-template-columns: 1fr; }
      .progress-bar { width: 100%; }
    }
  </style>
</head>
<body>

<!-- Copy this exact nav to all pages -->
<nav>
  <a href="/" class="logo">Edu<span>Flow</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/courses.html" class="nav-link">Courses</a>
    <a href="#" class="nav-link" id="nav-dashboard" style="display:none">Dashboard</a>
    <a href="#" class="nav-link" id="nav-profile" style="display:none">Profile</a>
    <a href="/admin-dashboard.html" class="nav-link" id="nav-admin" style="display:none;color:#F87171">Admin</a>
    <a href="/login.html" class="nav-link" id="nav-login">Login</a>
    <a href="/register.html" class="nav-link" id="nav-register">Register</a>
    <span class="nav-user" id="nav-user-info" style="display:none">
      <span style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#38BDF8,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:#fff;" id="nav-avatar">U</span>
      <strong id="nav-username">—</strong>
    </span>
    <button class="btn-ghost-nav" onclick="logout()" id="nav-logout" style="display:none">Logout</button>
  </div>
</nav>
  </nav>

  <div class="page">
    <!-- Profile Card -->
    <!-- Replace the profile-card div in student-profile.html with this: -->

<div class="profile-card" id="profile-card">
  <div class="profile-avatar" id="profile-avatar">S</div>
  <div class="profile-info" id="profile-view">
    <h1 id="profile-name">Loading…</h1>
    <p id="profile-email">—</p>
    <span class="badge badge-student">● Student</span>
    <div style="margin-top: 1rem;">
      <button class="btn-ghost" onclick="enterEditMode()">✏️ Edit Profile</button>
      <button class="btn-ghost" style="border-color: rgba(248,113,113,.3); color: var(--red);" onclick="confirmDeleteAccount()">🗑️ Delete Account</button>
    </div>
  </div>
  
  <!-- Edit Form (hidden by default) -->
  <div class="profile-info" id="profile-edit" style="display:none; flex: 1;">
    <div class="edit-field">
      <label>Username</label>
      <input type="text" id="edit-username" />
    </div>
    <div class="edit-field">
      <label>Email</label>
      <input type="email" id="edit-email" />
    </div>
    <div class="edit-field">
      <label>New Password (leave blank to keep current)</label>
      <input type="password" id="edit-password" placeholder="••••••••" />
    </div>
    <div style="margin-top: 1rem; display: flex; gap: .5rem;">
      <button class="btn-ghost" onclick="saveProfile()">💾 Save</button>
      <button class="btn-ghost" onclick="cancelEdit()">❌ Cancel</button>
    </div>
  </div>
</div>

    <!-- Enrolled Courses -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">📚 My Enrolled Courses</div>
        <div class="section-count" id="courses-count">0 courses</div>
      </div>
      <div id="courses-list">
        <div class="loading"><div class="spinner"></div>Loading your courses…</div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ─── Config ──────────────────────────────────────────────────────
    const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    // ─── Auth Guard ────────────────────────────────────────────────────
    if (!token || !user) {
      window.location.href = '/login.html';
    } else if (user.role !== 'student') {
      window.location.href = '/dashboard.html';
    }

    // ─── Init ──────────────────────────────────────────────────────────
    document.getElementById('nav-username').textContent = user?.username || 'Student';

    async function init() {
      await loadProfile();
      await loadMyCourses();
    }

    // ─── Load Profile ──────────────────────────────────────────────────
    async function loadProfile() {
      try {
        const res = await apiFetch('/api/users/me');
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        const u = data.user;
        document.getElementById('profile-name').textContent = u.username || 'Student';
        document.getElementById('profile-email').textContent = u.email || '—';
        document.getElementById('profile-avatar').textContent = (u.username || 'S').charAt(0).toUpperCase();
      } catch (err) {
        showToast('Failed to load profile: ' + err.message, 'error');
      }
    }

    // ─── Load My Courses with Progress ─────────────────────────────────
    async function loadMyCourses() {
      const list = document.getElementById('courses-list');

      try {
        // Get enrolled courses
        const res = await apiFetch('/api/courses/me/courses');
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        const courses = data.courses || [];
        document.getElementById('courses-count').textContent = `${courses.length} course${courses.length !== 1 ? 's' : ''}`;

        if (courses.length === 0) {
          list.innerHTML = '<div class="empty-state"><div class="empty-icon">📚</div>You haven\'t enrolled in any courses yet.<br><a href="/courses.html" style="color:var(--accent);text-decoration:none;">Browse courses →</a></div>';
          return;
        }

        // For each course, fetch progress
        const coursesWithProgress = await Promise.all(
          courses.map(async (c) => {
            try {
              const progressRes = await apiFetch(`/api/courses/${c._id}/progress`);
              const progressData = await progressRes.json();
              const progress = progressRes.ok && progressData.success ? progressData.progress : null;
              return { ...c, progress };
            } catch {
              return { ...c, progress: null };
            }
          })
        );

        list.innerHTML = coursesWithProgress.map(c => {
          const totalLessons = c.progress?.totalLessons || 0;
          const completedLessons = c.progress?.completedLessons || 0;
          const pct = totalLessons > 0 ? Math.round((completedLessons / totalLessons) * 100) : 0;

          return `
            <div class="course-item">
              <div>
                <div class="course-title">${escHtml(c.title)}</div>
                <div class="course-meta">by ${escHtml(c.instructor_id?.username || 'Unknown')}</div>
                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                <div class="progress-text">${completedLessons}/${totalLessons} lessons (${pct}%)</div>
              </div>
              <a href="/course.html?id=${c._id}" class="btn-ghost" style="text-decoration:none;">Continue →</a>
            </div>
          `;
        }).join('');

      } catch (err) {
        list.innerHTML = `<div class="empty-state">❌ ${err.message}</div>`;
      }
    }

    // ─── Helpers ───────────────────────────────────────────────────────
    function apiFetch(path, method = 'GET', body = null) {
      const opts = {
        method,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
        },
      };
      if (body) opts.body = JSON.stringify(body);
      return fetch(API + path, opts);
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    let toastTimer;
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `show toast-${type}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = ''; }, 3500);
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/';
    }
	// ─── Profile CRUD ───────────────────────────────────────────────────

function enterEditMode() {
  // Use the user from localStorage, not allUsers
  const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
  
  document.getElementById('edit-username').value = currentUser.username || '';
  document.getElementById('edit-email').value = currentUser.email || '';
  document.getElementById('edit-password').value = '';
  
  document.getElementById('profile-view').style.display = 'none';
  document.getElementById('profile-edit').style.display = 'block';
}

function cancelEdit() {
  document.getElementById('profile-view').style.display = 'block';
  document.getElementById('profile-edit').style.display = 'none';
}

async function saveProfile() {
  const username = document.getElementById('edit-username').value.trim();
  const email = document.getElementById('edit-email').value.trim();
  const password = document.getElementById('edit-password').value;

  if (!username || !email) {
    showToast('Username and email are required', 'error');
    return;
  }

  try {
    const body = { username, email };
    if (password) body.password = password;

    const res = await apiFetch('/api/users/me', 'PUT', body);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);

    // Update localStorage user
    const updatedUser = { ...user, username, email };
    localStorage.setItem('user', JSON.stringify(updatedUser));
    
    // Update UI
    document.getElementById('profile-name').textContent = username;
    document.getElementById('profile-email').textContent = email;
    document.getElementById('profile-avatar').textContent = username.charAt(0).toUpperCase();
    document.getElementById('nav-username').textContent = username;
    
    cancelEdit();
    showToast('✅ Profile updated', 'success');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function confirmDeleteAccount() {
  if (!confirm('⚠️ WARNING: This will permanently delete your account and all your data. This cannot be undone.\n\nAre you sure?')) return;
  if (!confirm('Final confirmation: Type "DELETE" to confirm')) return;
  
  deleteAccount();
}

async function deleteAccount() {
  try {
    const res = await apiFetch('/api/users/me', 'DELETE');
    const data = await res.json();
    if (!res.ok) throw new Error(data.message);

    logout();
    showToast('Account deleted', 'success');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function updateNav() {
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || 'null');
  
  const loginLink = document.getElementById('nav-login');
  const registerLink = document.getElementById('nav-register');
  const logoutBtn = document.getElementById('nav-logout');
  const userInfo = document.getElementById('nav-user-info');
  const usernameEl = document.getElementById('nav-username');
  const avatarEl = document.getElementById('nav-avatar');
  
  // Dynamic links
  const dashboardLink = document.getElementById('nav-dashboard');
  const profileLink = document.getElementById('nav-profile');
  const adminLink = document.getElementById('nav-admin');
  
  if (token && user) {
    // Hide auth links
    if (loginLink) loginLink.style.display = 'none';
    if (registerLink) registerLink.style.display = 'none';
    if (logoutBtn) logoutBtn.style.display = 'inline-block';
    if (userInfo) userInfo.style.display = 'flex';
    if (usernameEl) usernameEl.textContent = user.username || 'User';
    if (avatarEl) avatarEl.textContent = (user.username || 'U').charAt(0).toUpperCase();
    
    // Set role-specific links
    if (user.role === 'student') {
      if (dashboardLink) {
        dashboardLink.style.display = 'inline-block';
        dashboardLink.href = '/dashboard.html';
      }
      if (profileLink) {
        profileLink.style.display = 'inline-block';
        profileLink.href = '/student-profile.html';
      }
    } else if (user.role === 'instructor') {
      if (dashboardLink) {
        dashboardLink.style.display = 'inline-block';
        dashboardLink.href = '/instructor-dashboard.html';
      }
      if (profileLink) {
        profileLink.style.display = 'inline-block';
        profileLink.href = '/instructor-profile.html';
      }
    } else if (user.role === 'admin') {
      if (adminLink) adminLink.style.display = 'inline-block';
      if (dashboardLink) {
        dashboardLink.style.display = 'inline-block';
        dashboardLink.href = '/admin-dashboard.html';
      }
    }
  } else {
    // Show auth links
    if (loginLink) loginLink.style.display = 'inline-block';
    if (registerLink) registerLink.style.display = 'inline-block';
    if (logoutBtn) logoutBtn.style.display = 'none';
    if (userInfo) userInfo.style.display = 'none';
    
    // Hide all role links
    [dashboardLink, profileLink, adminLink].forEach(el => {
      if (el) {
        el.style.display = 'none';
        el.href = '#';
      }
    });
  }
}
    // ─── Boot ─────────────────────────────────────────────────────────
    init();
  </script>

</body>
</html>
