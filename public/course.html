<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course — EduFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Nav — exact match */
    nav { 
      position: fixed; top: 0; width: 100%; z-index: 100;
      background: rgba(8,12,20,.85); backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 0 2rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-weight: 700; font-size: 1.3rem; color: #38BDF8; text-decoration: none; font-family: 'Sora', sans-serif; }
    .logo span { color: #fff; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-link { color: #64748B; text-decoration: none; font-size: .9rem; font-weight: 500; transition: color .2s; font-family: 'DM Sans', sans-serif; }
    .nav-link:hover, .nav-link.active { color: #F1F5F9; }
    .btn-ghost-nav { 
      background: transparent; border: 1px solid rgba(255,255,255,0.07);
      color: #64748B; padding: .45rem 1.1rem; border-radius: 10px;
      font-size: .82rem; cursor: pointer;
      font-family: 'DM Sans', sans-serif; transition: all .2s;
    }
    .btn-ghost-nav:hover { border-color: #38BDF8; color: #38BDF8; }

    /* Back link */
    .back-link {
      color: #6b7280; text-decoration: none;
      display: inline-flex; align-items: center; gap: .5rem;
      margin-bottom: 1.5rem; font-size: .9rem;
      font-family: 'DM Sans', sans-serif;
      transition: color .2s;
    }
    .back-link:hover { color: #fff; }

    /* Course header card */
    .course-header-card {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 2rem;
      align-items: start;
    }
    .course-header-thumb {
      width: 100%;
      border-radius: 16px;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #1e293b;
    }
    .course-header-title {
      font-family: 'Sora', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: .5rem;
      line-height: 1.3;
    }
    .course-header-instructor {
      font-size: .9rem;
      color: #6b7280;
      margin-bottom: 1rem;
      font-family: 'DM Sans', sans-serif;
    }
    .course-header-desc {
      color: #9ca3af;
      line-height: 1.7;
      margin-bottom: 1.5rem;
      font-family: 'DM Sans', sans-serif;
    }
    .enroll-btn-large {
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      color: white;
      border: none;
      padding: .8rem 2rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      font-family: 'Sora', sans-serif;
      display: inline-block;
    }
    .enroll-btn-large:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(6,182,212,.35);
    }
    .enroll-btn-large:disabled {
      background: #1e293b;
      color: #6b7280;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .enrolled-state {
      font-size: .9rem;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: .5rem;
      font-family: 'DM Sans', sans-serif;
    }

    /* Lessons section — uses YOUR .lesson-item from style.css */
    .lessons-wrap {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      overflow: hidden;
    }
    .lessons-wrap-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lessons-wrap-title {
      font-family: 'Sora', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
    }
    .lessons-count {
      font-size: .85rem;
      color: #6b7280;
      font-family: 'DM Sans', sans-serif;
    }

    /* Loading */
    .loading { text-align: center; padding: 4rem; color: #6b7280; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(6,182,212,.2);
      border-top-color: #06b6d4;
      border-radius: 50%; animation: spin .8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty */
    .empty-state { text-align: center; padding: 3rem; color: #6b7280; font-family: 'DM Sans', sans-serif; }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 300;
      background: #0f172a; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 14px 18px;
      font-size: 13px; color: #fff; font-family: 'DM Sans', sans-serif;
      transform: translateY(100px); opacity: 0;
      transition: all .35s; max-width: 320px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.toast-success { border-color: rgba(52,211,153,.4); }
    #toast.toast-error { border-color: rgba(239,68,68,.4); }

    @media (max-width: 768px) {
      .course-header-card { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

  <!-- Nav -->
 <!-- Copy this exact nav to all pages -->
<nav>
  <a href="/" class="logo">Edu<span>Flow</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link" id="nav-home">Home</a>
    <a href="/courses.html" class="nav-link" id="nav-courses">Courses</a>
    
    <!-- Dynamic: href set by JavaScript based on role -->
    <a href="#" class="nav-link" id="nav-dashboard" style="display:none">Dashboard</a>
    <a href="#" class="nav-link" id="nav-profile" style="display:none">Profile</a>
    
    <!-- Auth -->
    <a href="/login.html" class="nav-link" id="nav-login">Login</a>
    <a href="/register.html" class="nav-link" id="nav-register">Register</a>
    
    <!-- User -->
    <span class="nav-user" id="nav-user-info" style="display:none">
      <span id="nav-avatar">U</span>
      <strong id="nav-username">—</strong>
    </span>
    <button class="btn-ghost-nav" onclick="logout()" id="nav-logout" style="display:none">Logout</button>
  </div>
</nav>

  <!-- Page -->
  <section class="pt-32 pb-20 px-6 max-w-4xl mx-auto">
    <a href="/courses.html" class="back-link">← Back to Courses</a>

    <div id="course-content">
      <div class="loading"><div class="spinner"></div>Loading course...</div>
    </div>
  </section>

  <div id="toast"></div>
	<script src="/js/nav.js"></script>
  <script>
    // ⚠️ PORT 3000
    const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('id');

    if (!courseId) {
      window.location.href = '/courses.html';
    }

    function init() {
      
      loadCourse();
    }



    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/';
    }

    async function loadCourse() {
      const container = document.getElementById('course-content');

      try {
        const res = await fetch(API + `/api/courses/${courseId}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        const course = data.course;
        const thumb = course.thumbnail || 'https://via.placeholder.com/600x340/0f172a/06b6d4?text=Course';
        const instructor = course.instructor_id?.username || 'Unknown';
        const students = course.students?.length || 0;
        
        // ✅ FIXED: Proper enrolled check
        const isEnrolled = user && course.students?.some(s => {
          const sid = typeof s === 'string' ? s : (s._id || s.id || '').toString();
          const uid = (user._id || user.id || '').toString();
          return sid === uid;
        });

        // Fetch lessons
        const lessonsRes = await fetch(API + `/api/courses/${courseId}/lessons`);
        const lessonsData = await lessonsRes.json();
        const lessons = lessonsRes.ok ? (lessonsData.lessons || []) : [];

        container.innerHTML = `
          <div class="course-header-card">
            <img class="course-header-thumb" src="${escHtml(thumb)}" onerror="this.src='https://via.placeholder.com/600x340/0f172a/06b6d4?text=Course'" alt=""/>
            <div>
              <h1 class="course-header-title">${escHtml(course.title)}</h1>
              <p class="course-header-instructor">by ${escHtml(instructor)} • ${students} students enrolled</p>
              <p class="course-header-desc">${escHtml(course.description)}</p>
              ${token && user?.role === 'student'
                ? (isEnrolled 
                  ? '<div class="enrolled-state"><span style="font-size:1.2rem;">✓</span> You are enrolled in this course</div>'
                  : '<button class="enroll-btn-large" onclick="enroll()">Enroll Now</button>')
                : !token ? '<p style="color:#6b7280;font-size:.9rem;font-family:\'DM Sans\',sans-serif;">Login as a student to enroll</p>' : ''
              }
            </div>
          </div>

          <div class="lessons-wrap">
            <div class="lessons-wrap-header">
              <div class="lessons-wrap-title">📚 Course Content</div>
              <span class="lessons-count">${lessons.length} lessons</span>
            </div>
            ${lessons.length === 0 
              ? '<div class="empty-state">No lessons available yet.</div>'
              : lessons.map((l, i) => `
                <div class="lesson-item">
                  <div class="lesson-number">${i + 1}</div>
                  <div style="flex:1;">
                    <div style="font-weight:600;margin-bottom:.25rem;font-family:'Sora',sans-serif;">${escHtml(l.title)}</div>
                    <div style="font-size:.8rem;color:#6b7280;font-family:'DM Sans',sans-serif;">${escHtml(l.duration || '—')}</div>
                  </div>
                  <span style="font-size:.8rem;color:${isEnrolled ? '#34d399' : '#6b7280'};font-family:'DM Sans',sans-serif;">
                    ${isEnrolled ? '🔓 Available' : '🔒 Locked'}
                  </span>
                </div>
              `).join('')
            }
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="empty-state">❌ ${err.message}</div>`;
      }
    }

    async function enroll() {
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      try {
        const res = await fetch(API + `/api/courses/${courseId}/enroll`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.message);
        
        showToast('✅ Enrolled successfully!', 'success');
        loadCourse();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function escHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    let toastTimer;
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `show toast-${type}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = ''; }, 3500);
    }

    init();
  </script>

</body>
</html>
